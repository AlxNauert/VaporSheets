<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VAPORSHEET — Neon Grid Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2fd0;--pink2:#ff71ce;--cyan:#01cdfe;--mint:#05ffa1;--purple:#b967ff;--text:#efe2ff;--line:rgba(255,113,206,.12)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Share Tech Mono',ui-monospace,'Courier New',monospace;background:#0a0118;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-2;background:radial-gradient(1200px 600px at 50% -10%,rgba(255,47,208,.22),transparent 60%),radial-gradient(900px 520px at 8% 112%,rgba(1,205,254,.18),transparent 60%),radial-gradient(900px 520px at 92% 112%,rgba(185,103,255,.20),transparent 60%),linear-gradient(180deg,#0a0118,#150330 60%,#1a0438)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid rgba(255,113,206,.28);background:linear-gradient(90deg,rgba(255,47,208,.13),rgba(1,205,254,.07) 60%,rgba(185,103,255,.13))}
.brand{font-family:'Orbitron',sans-serif;font-weight:800;font-size:20px;letter-spacing:4px;background:linear-gradient(90deg,#ff71ce,#01cdfe,#b967ff,#ff71ce);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 10px rgba(255,47,208,.75));animation:hue 8s linear infinite;white-space:nowrap}
@keyframes hue{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.sub{font-size:11px;color:#8a6bb5;letter-spacing:1px;white-space:nowrap}
.spacer{flex:1}
.tbtn{font-family:inherit;font-size:12.5px;line-height:1;padding:7px 11px;border-radius:6px;cursor:pointer;background:rgba(255,255,255,.035);border:1px solid rgba(255,113,206,.32);color:#e9d6ff;transition:background .15s,border-color .15s,box-shadow .15s,color .15s;user-select:none;white-space:nowrap}
.tbtn:hover{background:rgba(255,47,208,.18);border-color:var(--pink);color:#fff;box-shadow:0 0 12px rgba(255,47,208,.55)}
.tbtn:active{transform:translateY(1px)}
.tbtn.on{background:rgba(1,205,254,.22);border-color:var(--cyan);color:#fff;box-shadow:0 0 12px rgba(1,205,254,.6)}
.tbtn.primary{background:linear-gradient(90deg,rgba(255,47,208,.35),rgba(1,205,254,.35));border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(1,205,254,.45)}
.tbtn.primary:hover{box-shadow:0 0 22px rgba(255,47,208,.7)}
.tbtn.danger:hover{background:rgba(255,60,90,.22);border-color:#ff4d6d;box-shadow:0 0 12px rgba(255,60,90,.6)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid rgba(255,113,206,.18);background:rgba(18,3,42,.72);backdrop-filter:blur(6px)}
.sep{width:1px;height:20px;background:rgba(255,113,206,.28);margin:0 3px}
.colorbtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:5px}
.colorbtn input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.fbar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:rgba(8,1,20,.65);border-bottom:1px solid rgba(255,113,206,.18)}
.namebox{min-width:86px;text-align:center;font-size:12.5px;letter-spacing:1px;padding:5px 8px;border-radius:5px;background:rgba(1,205,254,.10);border:1px solid rgba(1,205,254,.35);color:var(--cyan);text-shadow:0 0 8px rgba(1,205,254,.7)}
.fx{color:var(--pink2);font-style:italic;font-weight:700;font-size:13px;text-shadow:0 0 8px rgba(255,113,206,.8)}
#formulaInput{flex:1;min-width:0;background:rgba(255,255,255,.045);border:1px solid rgba(1,205,254,.3);border-radius:6px;padding:6px 10px;color:#fff;font-family:inherit;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
#formulaInput:focus{border-color:var(--cyan);box-shadow:0 0 14px rgba(1,205,254,.5)}
#formulaInput::placeholder{color:#6b4f94}
.grid-wrap{flex:1;overflow:auto;position:relative}
.grid-wrap::-webkit-scrollbar{width:12px;height:12px}
.grid-wrap::-webkit-scrollbar-track{background:rgba(255,113,206,.06)}
.grid-wrap::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff2fd0,#01cdfe);border-radius:6px}
#grid{display:grid;position:relative;width:max-content}
.corner,.colhead,.rowhead{background:linear-gradient(180deg,#260a4a,#1b0538);color:#c9a8e8;font-size:11.5px;letter-spacing:.5px;border-right:1px solid rgba(255,113,206,.16);border-bottom:1px solid rgba(255,113,206,.16);text-align:center;user-select:none}
.corner{position:sticky;top:0;left:0;z-index:6;line-height:29px;background:linear-gradient(180deg,#320e5c,#240a45);color:#ff71ce}
.colhead{position:sticky;top:0;z-index:4;line-height:29px;cursor:pointer}
.colhead:hover,.colhead.hl{color:#fff;background:linear-gradient(180deg,#3a1268,#2a0b50)}
.rowhead{position:sticky;left:0;z-index:3;line-height:27px;cursor:pointer}
.rowhead:hover,.rowhead.hl{color:#fff;background:linear-gradient(180deg,#3a1268,#2a0b50)}
.cell{padding:0 6px;line-height:27px;font-size:12.5px;color:#efe2ff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;min-width:0;cursor:cell;background-color:transparent}
.cell.sel{background-image:linear-gradient(rgba(1,205,254,.13),rgba(1,205,254,.13))}
.cell.active{outline:2px solid var(--cyan);outline-offset:-2px;background-image:linear-gradient(rgba(1,205,254,.20),rgba(1,205,254,.20));box-shadow:inset 0 0 18px rgba(1,205,254,.45);z-index:2}
#editor{position:absolute;display:none;z-index:20;border:2px solid var(--cyan);background:#0b0220;color:#fff;font-family:inherit;font-size:12.5px;padding:0 4px;margin:0;outline:none;border-radius:0;box-shadow:0 0 22px rgba(1,205,254,.85)}
#fillHandle{position:absolute;width:8px;height:8px;background:var(--cyan);border:1px solid #0a0118;box-shadow:0 0 10px var(--cyan);cursor:crosshair;z-index:15;display:none;user-select:none}
#fillHandle:hover{background:var(--pink2);box-shadow:0 0 14px var(--pink2)}
#fillPreview{position:absolute;pointer-events:none;z-index:14;border:2px dashed var(--cyan);background:rgba(1,205,254,.10);display:none}
.tabs{display:flex;align-items:center;gap:6px;padding:6px 12px;border-top:1px solid rgba(255,113,206,.22);background:rgba(8,1,20,.85);overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:7px 7px 3px 3px;cursor:pointer;font-size:12px;letter-spacing:.5px;border:1px solid rgba(255,113,206,.25);background:rgba(255,255,255,.025);color:#c9a8e8;white-space:nowrap;transition:all .15s}
.tab:hover{border-color:var(--pink);color:#fff}
.tab.active{background:linear-gradient(180deg,rgba(255,47,208,.32),rgba(1,205,254,.14));color:#fff;border-color:var(--pink);box-shadow:0 0 14px rgba(255,47,208,.5)}
.tab .tabx{opacity:.5;font-size:14px;line-height:1}
.tab .tabx:hover{opacity:1;color:#ff4d6d}
.tab.add{padding:5px 12px;font-size:15px;color:var(--mint)}
.status{margin-left:auto;font-size:11.5px;color:#9c7cc9;letter-spacing:.5px;white-space:nowrap}
.modal{position:fixed;inset:0;z-index:1000;background:rgba(5,0,15,.72);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px}
.modal.hidden{display:none}
.modal-card{width:440px;max-width:100%;background:linear-gradient(160deg,#1e073d,#11022a);border:1px solid var(--pink);border-radius:14px;padding:22px;box-shadow:0 0 44px rgba(255,47,208,.42);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h2{margin:0 0 4px;font-family:'Orbitron',sans-serif;font-size:16px;letter-spacing:2px;color:#fff;text-shadow:0 0 14px rgba(255,47,208,.9)}
.hint{margin:0 0 16px;font-size:11.5px;color:#9c7cc9;letter-spacing:.5px}
.modal-card .row{display:flex;gap:12px;margin-bottom:12px}
.modal-card .row > *{flex:1}
.modal-card label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:#c9a8e8;letter-spacing:.5px}
.modal-card label.chk{flex-direction:row;align-items:center;gap:8px;padding-top:16px}
.modal-card input[type=number],.modal-card input[type=text],.modal-card select{background:rgba(255,255,255,.05);border:1px solid rgba(1,205,254,.32);border-radius:6px;padding:8px 10px;color:#fff;font-family:inherit;font-size:13px;outline:none;width:100%}
.modal-card input:focus,.modal-card select:focus{border-color:var(--cyan);box-shadow:0 0 12px rgba(1,205,254,.55)}
.modal-card input[type=checkbox]{width:16px;height:16px;accent-color:#ff2fd0;cursor:pointer}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
#chartPanel{position:fixed;top:80px;right:24px;width:500px;height:380px;background:linear-gradient(160deg,#1e073d,#11022a);border:1px solid var(--cyan);border-radius:10px;box-shadow:0 0 40px rgba(1,205,254,.55);z-index:500;display:flex;flex-direction:column;overflow:hidden}
#chartPanel.hidden{display:none}
.chart-header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(8,1,20,.7);border-bottom:1px solid rgba(1,205,254,.3);cursor:move;user-select:none}
.chart-header select,.chart-header input{background:rgba(255,255,255,.06);border:1px solid rgba(1,205,254,.3);border-radius:5px;padding:5px 8px;color:#fff;font-family:inherit;font-size:11.5px;outline:none}
.chart-header select{width:80px}
.chart-header input{flex:1;min-width:0}
.chart-header .chart-close{background:rgba(255,60,90,.12);border:1px solid rgba(255,60,90,.4);color:#ff8fa3;border-radius:5px;padding:4px 9px;cursor:pointer;font-family:inherit;font-size:14px;line-height:1}
.chart-header .chart-close:hover{background:rgba(255,60,90,.3);color:#fff}
#chartCanvas{flex:1;width:100%;min-height:0;display:block}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">VAPORSHEET</div>
    <div class="sub">// neon grid terminal</div>
    <div class="spacer"></div>
    <button class="tbtn primary" id="btnTable">⊞ Build Table</button>
    <button class="tbtn" id="btnChart">📊 Chart</button>
    <button class="tbtn" id="btnExportCsv">↓ CSV</button>
    <button class="tbtn" id="btnExportJson">↓ JSON</button>
    <button class="tbtn" id="btnImportJson">↑ JSON</button>

  </header>
  <div class="toolbar">

    <button class="tbtn" id="btnB" title="Bold (Ctrl+B)"><b>B</b></button>
    <button class="tbtn" id="btnI" title="Italic (Ctrl+I)"><i>I</i></button>
    <button class="tbtn" id="btnU" title="Underline (Ctrl+U)"><u>U</u></button>
    <div class="sep"></div>
    <label class="tbtn colorbtn" id="lblText" title="Text color">A<input type="color" id="colorText" value="#ff71ce"></label>
    <label class="tbtn colorbtn" id="lblFill" title="Fill color">▨<input type="color" id="colorFill" value="#2b0a4d"></label>
    <button class="tbtn" id="btnClearFmt">Clear fmt</button>
    <div class="sep"></div>
    <button class="tbtn" id="btnLeft" title="Left">↤</button>
    <button class="tbtn" id="btnCenter" title="Center">↔</button>
    <button class="tbtn" id="btnRight" title="Right">↦</button>
    <div class="sep"></div>
    <select class="tbtn" id="fmtSel" title="Number format">
      <option value="">General</option>
      <option value="fixed2">0.00</option>
      <option value="currency">$0.00</option>
      <option value="percent">0.0%</option>

    <div class="sep"></div>
    <button class="tbtn" id="btnCScale" title="Color scale (heatmap)">◐ Scale</button>
    <button class="tbtn" id="btnBars" title="Data bars">▮ Bars</button>
    <div class="sep"></div>
    <button class="tbtn" id="btnAutoFill" title="Autofill down from adjacent column">⤓ AutoFill</button>
    <div class="sep"></div>
    <button class="tbtn" id="btnInsRow" title="Insert row">+Row</button>
    <button class="tbtn" id="btnDelRow" title="Delete row">−Row</button>
    <button class="tbtn" id="btnInsCol" title="Insert col">+Col</button>
    <button class="tbtn" id="btnDelCol" title="Delete col">−Col</button>
  </div>
  <div class="fbar">
    <div class="namebox" id="namebox">A1</div>
    <div class="fx">fx</div>
    <input id="formulaInput" type="text" spellcheck="false" autocomplete="off" placeholder="Type a value or =FORMULA">
  </div>
  <div class="grid-wrap" id="gridWrap"><div id="grid"></div></div>
  <div class="tabs" id="tabs"></div>
</div>

<div id="chartPanel" class="hidden">
  <div class="chart-header" id="chartHeader">
    <select id="chartType"><option value="bar">Bar</option><option value="line">Line</option><option value="area">Area</option><option value="pie">Pie</option></select>
    <input type="text" id="chartTitle" placeholder="Chart title (optional)">
    <button class="chart-close" id="chartClose">×</button>
  </div>
  <canvas id="chartCanvas"></canvas>
</div>

<div class="modal hidden" id="modal">
  <div class="modal-card">
    <h2>⊞ BUILD A TABLE</h2>
    <p class="hint">Creates a styled table starting at the selected cell.</p>
    <div class="row">
      <label>Columns<input type="number" id="tCols" value="4" min="1" max="26"></label>
      <label>Rows<input type="number" id="tRows" value="5" min="1" max="200"></label>
    </div>

      <label>Header names (comma separated)<input type="text" id="tNames" placeholder="Item, Qty, Price, Total"></label>
    </div>
    <div class="row">
      <label>Theme
        <select id="tTheme">
          <option value="neon">Neon Pink</option>
          <option value="cyber">Cyber Cyan</option>

</div>
<input type="file" id="fileInput" accept=".json" style="display:none">

<script>
'use strict';
const $=s=>document.querySelector(s);
const el=(t,c)=>{const d=document.createElement(t);if(c)d.className=c;return d;};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const DEF_COLS=26,DEF_ROWS=60,HEAD_W=46,COL_W=110,ROW_H=28,MAX_ROWS=400,MAX_COLS=52;
const PALETTE=['#ff2fd0','#01cdfe','#b967ff','#05ffa1','#ff71ce','#fffb96','#ff8c42','#7cffcb'];

function colName(c){let s='';c++;while(c>0){const m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26);}return s;}
function colIndex(s){if(typeof s!=='string'||!s)return -1;let n=0;s=s.toUpperCase();for(const ch of s){const v=ch.charCodeAt(0)-64;if(v<1||v>26)return -1;n=n*26+v;}return n-1;}
const cellKey=(r,c)=>colName(c)+(r+1);
function parseRef(ref){if(typeof ref!=='string')return null;const m=/^\$?([A-Za-z]{1,3})\$?(\d{1,7})$/.exec(ref.trim());if(!m)return null;const c=colIndex(m[1]),r=parseInt(m[2],10)-1;if(c<0||r<0)return null;return{r,c};}
function formatNum(n){if(!isFinite(n))return'#NUM!';if(Number.isInteger(n))return String(n);return String(Math.round(n*1e10)/1e10);}
function hexToRgb(hex){const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);return m?{r:parseInt(m[1],16),g:parseInt(m[2],16),b:parseInt(m[3],16)}:{r:0,g:0,b:0};}

class FormulaError{constructor(code){this.code=code;}}
class Range{constructor(values){this.values=values;}}
const ERR=code=>({err:code});
const isErr=v=>!!v&&typeof v==='object'&&typeof v.err==='string';

function tokenize(src){
  const out=[];let i=0;
  while(i<src.length){
    const c=src[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){
      let j=i;while(j<src.length&&/[0-9]/.test(src[j]))j++;
      if(src[j]==='.'){j++;while(j<src.length&&/[0-9]/.test(src[j]))j++;}
      if(/[eE]/.test(src[j]||'')&&/[0-9+\-]/.test(src[j+1]||'')){j+=2;while(j<src.length&&/[0-9]/.test(src[j]))j++;}
      out.push({t:'num',v:parseFloat(src.slice(i,j))});i=j;continue;
    }
    if(c==='"'){
      let j=i+1,str='',closed=false;
      while(j<src.length){
        if(src[j]==='"'&&src[j+1]==='"'){str+='"';j+=2;}
        else if(src[j]==='"'){closed=true;j++;break;}
        else{str+=src[j];j++;}
      }
      if(!closed)throw new FormulaError('#ERROR!');
      out.push({t:'str',v:str});i=j;continue;
    }
    if(/[A-Za-z_$]/.test(c)){
      let j=i;while(j<src.length&&/[A-Za-z0-9_$.]/.test(src[j]))j++;
      out.push({t:'id',v:src.slice(i,j)});i=j;continue;
    }
    const two=src.substr(i,2);
    if(two==='<='||two==='>='||two==='<>'){out.push({t:'op',v:two});i+=2;continue;}
    if('+-*/^&<>(),:='.includes(c)){out.push({t:'op',v:c});i++;continue;}
    throw new FormulaError('#ERROR!');
  }
  return out;
}
function parseFormula(src){
  const toks=tokenize(src);let pos=0;
  const peek=()=>toks[pos];const next=()=>toks[pos++];
  const isOp=v=>{const t=peek();return t&&t.t==='op'&&t.v===v;};
  function parseCompare(){let left=parseConcat();while(peek()&&peek().t==='op'&&['=','<>','<','>','<=','>='].includes(peek().v)){const op=next().v;left={type:'bin',op,a:left,b:parseConcat()};}return left;}
  function parseConcat(){let left=parseAdd();while(isOp('&')){next();left={type:'bin',op:'&',a:left,b:parseAdd()};}return left;}
  function parseAdd(){let left=parseMul();while(peek()&&peek().t==='op'&&(peek().v==='+'||peek().v==='-')){const op=next().v;left={type:'bin',op,a:left,b:parseMul()};}return left;}
  function parseMul(){let left=parsePow();while(peek()&&peek().t==='op'&&(peek().v==='*'||peek().v==='/')){const op=next().v;left={type:'bin',op,a:left,b:parsePow()};}return left;}
  function parsePow(){let left=parseUnary();while(isOp('^')){next();left={type:'bin',op:'^',a:left,b:parseUnary()};}return left;}
  function parseUnary(){if(peek()&&peek().t==='op'&&(peek().v==='-'||peek().v==='+')){const op=next().v;return{type:'un',op,a:parseUnary()};}return parsePrimary();}
  function parsePrimary(){
    const tok=peek();if(!tok)throw new FormulaError('#ERROR!');
    if(tok.t==='num'){next();return{type:'num',v:tok.v};}
    if(tok.t==='str'){next();return{type:'str',v:tok.v};}
    if(tok.t==='op'&&tok.v==='('){next();const e=parseCompare();if(!isOp(')'))throw new FormulaError('#ERROR!');next();return e;}
    if(tok.t==='id'){
      next();const upper=tok.v.toUpperCase();
      if(isOp('(')){next();const args=[];if(isOp(')')){next();}else{for(;;){args.push(parseCompare());if(isOp(',')){next();continue;}if(isOp(')')){next();break;}throw new FormulaError('#ERROR!');}}return{type:'fn',name:upper,args};}
      if(upper==='TRUE')return{type:'bool',v:true};
      if(upper==='FALSE')return{type:'bool',v:false};
      const ref=parseRef(tok.v);
      if(ref){
        if(isOp(':')){next();const t2=next();if(!t2||t2.t!=='id')throw new FormulaError('#ERROR!');const ref2=parseRef(t2.v);if(!ref2)throw new FormulaError('#ERROR!');return{type:'range',a:ref,b:ref2};}
        return{type:'ref',r:ref.r,c:ref.c};
      }
      throw new FormulaError('#NAME?');
    }
    throw new FormulaError('#ERROR!');
  }
  const ast=parseCompare();if(pos!==toks.length)throw new FormulaError('#ERROR!');return ast;
}
function toNum(v){if(isErr(v))return v;if(v instanceof Range)return ERR('#VALUE!');if(typeof v==='number')return v;if(typeof v==='boolean')return v?1:0;if(typeof v==='string'){if(v.trim()==='')return 0;const n=Number(v);return isNaN(n)?ERR('#VALUE!'):n;}return 0;}
function toStr(v){if(isErr(v))return v;if(v instanceof Range)return ERR('#VALUE!');if(typeof v==='boolean')return v?'TRUE':'FALSE';if(v==null)return'';return String(v);}
function toBool(v){if(isErr(v))return v;if(v instanceof Range)return ERR('#VALUE!');if(typeof v==='boolean')return v;if(typeof v==='number')return v!==0;if(typeof v==='string'){const u=v.trim().toUpperCase();if(u==='TRUE')return true;if(u==='FALSE')return false;if(u==='')return false;return!!v;}return false;}
function flattenNums(args){const out=[];for(const a of args){const vals=a instanceof Range?a.values:[a];for(const v of vals){if(isErr(v))return v;if(typeof v==='number')out.push(v);else if(typeof v==='boolean')out.push(v?1:0);}}return out;}
function flattenAll(args){const out=[];for(const a of args){const vals=a instanceof Range?a.values:[a];for(const v of vals)out.push(v);}return out;}
function firstErr(vals){for(const v of vals)if(isErr(v))return v;return null;}
const FUNCS={
  SUM(args){const n=flattenNums(args);if(isErr(n))return n;return n.reduce((a,b)=>a+b,0);},
  AVERAGE(args){const n=flattenNums(args);if(isErr(n))return n;if(!n.length)return ERR('#DIV/0!');return n.reduce((a,b)=>a+b,0)/n.length;},
  MIN(args){const n=flattenNums(args);if(isErr(n))return n;return n.length?Math.min(...n):0;},
  MAX(args){const n=flattenNums(args);if(isErr(n))return n;return n.length?Math.max(...n):0;},
  COUNT(args){const all=flattenAll(args);const e=firstErr(all);if(e)return e;return all.filter(v=>typeof v==='number').length;},
  COUNTA(args){const all=flattenAll(args);const e=firstErr(all);if(e)return e;return all.filter(v=>v!==''&&v!==null&&v!==undefined).length;},
  IF(args){if(args.length<2)return ERR('#VALUE!');const c=toBool(args[0]);if(isErr(c))return c;if(c)return args[1];return args.length>2?args[2]:false;},
  ROUND(args){const x=toNum(args[0]);if(isErr(x))return x;const d=args.length>1?toNum(args[1]):0;if(isErr(d))return d;const m=Math.pow(10,Math.trunc(d));return Math.round(x*m)/m;},
  ABS(args){const x=toNum(args[0]);return isErr(x)?x:Math.abs(x);},
  SQRT(args){const x=toNum(args[0]);if(isErr(x))return x;return x<0?ERR('#NUM!'):Math.sqrt(x);},
  POWER(args){const a=toNum(args[0]),b=toNum(args[1]);if(isErr(a))return a;if(isErr(b))return b;return Math.pow(a,b);},
  MOD(args){const a=toNum(args[0]),b=toNum(args[1]);if(isErr(a))return a;if(isErr(b))return b;return b===0?ERR('#DIV/0!'):a%b;},
  LEN(args){const s=toStr(args[0]);return isErr(s)?s:s.length;},
  UPPER(args){const s=toStr(args[0]);return isErr(s)?s:s.toUpperCase();},
  LOWER(args){const s=toStr(args[0]);return isErr(s)?s:s.toLowerCase();},
  TRIM(args){const s=toStr(args[0]);return isErr(s)?s:s.trim().replace(/\s+/g,' ');},
  CONCAT(args){let out='';for(const v of flattenAll(args)){const s=toStr(v);if(isErr(s))return s;out+=s;}return out;},
  AND(args){const all=flattenAll(args);const e=firstErr(all);if(e)return e;return all.every(v=>toBool(v)===true);},
  OR(args){const all=flattenAll(args);const e=firstErr(all);if(e)return e;return all.some(v=>toBool(v)===true);},
  NOT(args){const b=toBool(args[0]);return isErr(b)?b:!b;}
};
function evalNode(node,ctx){
  switch(node.type){
    case 'num':return node.v;
    case 'str':return node.v;
    case 'bool':return node.v;
    case 'ref':{if(node.r<0||node.c<0)return ERR('#REF!');return ctx.getCell(node.r,node.c);}
    case 'range':{
      const r1=Math.min(node.a.r,node.b.r),r2=Math.max(node.a.r,node.b.r);
      const c1=Math.min(node.a.c,node.b.c),c2=Math.max(node.a.c,node.b.c);
      if(r1<0||c1<0)return ERR('#REF!');
      const vals=[];for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)vals.push(ctx.getCell(r,c));
      return new Range(vals);
    }
    case 'un':{const v=toNum(evalNode(node.a,ctx));if(isErr(v))return v;return node.op==='-'?-v:v;}
    case 'bin':{
      const A=evalNode(node.a,ctx),B=evalNode(node.b,ctx);
      if(isErr(A))return A;if(isErr(B))return B;
      if(node.op==='&'){const sa=toStr(A),sb=toStr(B);if(isErr(sa))return sa;if(isErr(sb))return sb;return sa+sb;}
      if(['=','<>','<','>','<=','>='].includes(node.op)){
        if(A instanceof Range||B instanceof Range)return ERR('#VALUE!');
        const bothNum=(typeof A==='number'||typeof A==='boolean')&&(typeof B==='number'||typeof B==='boolean');
        let cmp;
        if(bothNum){const x=Number(A),y=Number(B);cmp=x<y?-1:x>y?1:0;}
        else{const x=toStr(A).toLowerCase(),y=toStr(B).toLowerCase();cmp=x<y?-1:x>y?1:0;}
        switch(node.op){case'=':return cmp===0;case'<>':return cmp!==0;case'<':return cmp<0;case'>':return cmp>0;case'<=':return cmp<=0;case'>=':return cmp>=0;}
      }
      const x=toNum(A),y=toNum(B);
      if(isErr(x))return x;if(isErr(y))return y;
      switch(node.op){case'+':return x+y;case'-':return x-y;case'*':return x*y;case'/':return y===0?ERR('#DIV/0!'):x/y;case'^':return Math.pow(x,y);}
      return ERR('#ERROR!');
    }
    case 'fn':{
      const name=node.name;
      if(!Object.prototype.hasOwnProperty.call(FUNCS,name))return ERR('#NAME?');
      const args=node.args.map(a=>evalNode(a,ctx));
      const e=firstErr(args);if(e)return e;
      try{return FUNCS[name](args);}catch(err){return ERR('#VALUE!');}
    }
  }
  return ERR('#ERROR!');
}
function makeEvaluator(sheet){
  const cache=new Map(),visiting=new Set();
  function literalValue(raw){
    const t=raw.trim();
    if(t==='')return '';
    if(/^-?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(t))return Number(t);
    const u=t.toUpperCase();
    if(u==='TRUE')return true;
    if(u==='FALSE')return false;
    return raw;
  }
  function getCell(r,c){
    if(r<0||c<0||r>=MAX_ROWS||c>=MAX_COLS)return ERR('#REF!');
    const key=cellKey(r,c);
    if(cache.has(key))return cache.get(key);
    if(visiting.has(key))return ERR('#CYCLE!');
    const cell=sheet.cells[key];
    if(!cell||cell.raw===undefined||cell.raw===null||cell.raw===''){cache.set(key,'');return'';}
    const raw=String(cell.raw);let val;
    if(raw.charAt(0)==='='){
      visiting.add(key);
      try{const ast=parseFormula(raw.slice(1));val=evalNode(ast,{getCell,sheet});if(val instanceof Range)val=val.values.length?val.values[0]:'';}
      catch(err){val=ERR(err instanceof FormulaError?err.code:'#ERROR!');}
      visiting.delete(key);
    } else {val=literalValue(raw);}
    cache.set(key,val);return val;
  }
  return{getCell};
}

function getCellObj(r,c,create){
  const key=cellKey(r,c);let cell=cur().cells[key];
  if(!cell&&create){cell={raw:'',st:{}};cur().cells[key]=cell;}
  return cell;
}
function pruneCell(key){
  const cell=cur().cells[key];if(!cell)return;
  const hasStyle=cell.st&&Object.keys(cell.st).length>0;
  const hasRaw=cell.raw!==''&&cell.raw!=null;
  if(!hasStyle&&!hasRaw)delete cur().cells[key];
}
function setCellRaw(r,c,raw){
  const cell=getCellObj(r,c,true);
  cell.raw=raw==null?'':String(raw);
  pruneCell(cellKey(r,c));
}

function snapshot(){return JSON.stringify({sheets,activeSheet});}
function pushUndo(){undoStack.push(snapshot());if(undoStack.length>60)undoStack.shift();redoStack.length=0;}
function restore(str){const data=JSON.parse(str);sheets=data.sheets;activeSheet=clamp(data.activeSheet,0,sheets.length-1);sel={ar:0,ac:0,fr:0,fc:0};renderTabs();render();}
function undo(){if(!undoStack.length)return;redoStack.push(snapshot());restore(undoStack.pop());}
function redo(){if(!redoStack.length)return;undoStack.push(snapshot());restore(redoStack.pop());}

/* AUTOFILL */
function translateFormula(raw,dr,dc){
  if(typeof raw!=='string'||raw.charAt(0)!=='=')return raw;
  return '='+raw.slice(1).replace(/(\$?)([A-Za-z]{1,3})(\$?)(\d{1,7})(?![\w.(])/g,(m,d1,col,d2,row)=>{
    const c=colIndex(col),r=parseInt(row,10)-1;
    if(c<0||r<0)return m;
    const nc=d1==='$'?c:c+dc,nr=d2==='$'?r:r+dr;
    if(nc<0||nr<0)return '#REF!';
    return (d1||'')+colName(nc)+(d2||'')+(nr+1);
  });
}
function computeFillTarget(src,r,c){
  const inCols=c>=src.c1&&c<=src.c2,inRows=r>=src.r1&&r<=src.r2;
  if(inCols&&r>src.r2)return{r1:src.r1,r2:r,c1:src.c1,c2:src.c2,dir:'down'};
  if(inCols&&r<src.r1)return{r1:r,r2:src.r2,c1:src.c1,c2:src.c2,dir:'up'};
  if(inRows&&c>src.c2)return{r1:src.r1,r2:src.r2,c1:src.c1,c2:c,dir:'right'};
  if(inRows&&c<src.c1)return{r1:src.r1,r2:src.r2,c1:c,c2:src.c2,dir:'left'};
  return null;
}
function applyFill(src,target){
  const sheet=cur();pushUndo();
  const srcH=src.r2-src.r1+1,srcW=src.c2-src.c1+1,dir=target.dir;
  for(let r=target.r1;r<=target.r2;r++)for(let c=target.c1;c<=target.c2;c++){
    if(r>=src.r1&&r<=src.r2&&c>=src.c1&&c<=src.c2)continue;
    let srcR,srcC;
    if(dir==='down'){const o=r-src.r2-1;srcR=src.r1+(o%srcH);srcC=src.c1+((c-src.c1)%srcW);}
    else if(dir==='up'){const o=src.r1-r-1;srcR=src.r2-(o%srcH);srcC=src.c1+((c-src.c1)%srcW);}
    else if(dir==='right'){const o=c-src.c2-1;srcC=src.c1+(o%srcW);srcR=src.r1+((r-src.r1)%srcH);}
    else{const o=src.c1-c-1;srcC=src.c2-(o%srcW);srcR=src.r1+((r-src.r1)%srcH);}
    const srcCell=sheet.cells[cellKey(srcR,srcC)];
    if(!srcCell){delete sheet.cells[cellKey(r,c)];continue;}
    const newRaw=translateFormula(srcCell.raw||'',r-srcR,c-srcC);
    const cell=getCellObj(r,c,true);
    cell.raw=newRaw;
    cell.st=JSON.parse(JSON.stringify(srcCell.st||{}));
    pruneCell(cellKey(r,c));
  }
  refresh();updateStatus();
}
function autoFillDown(){
  const{r1,r2,c1,c2}=selRange();const sheet=cur();const{getCell}=makeEvaluator(sheet);
  let probeCol=c1-1;if(probeCol<0)probeCol=c2+1;
  if(probeCol<0||probeCol>=MAX_COLS)return;
  let targetEnd=r2;
  for(let r=r2+1;r<sheet.rows;r++){
    const v=getCell(r,probeCol);
    if(v===''||v===null||v===undefined)break;
    targetEnd=r;
  }
  if(targetEnd<=r2)return;
  applyFill({r1,r2,c1,c2},{r1,r2:targetEnd,c1,c2,dir:'down'});
  sel={ar:r1,ac:c1,fr:targetEnd,fc:c2};
  updateSelectionUI();syncFormulaBar();updateStatus();
}
function fillSelectionDown(){
  const{r1,r2,c1,c2}=selRange();if(r2<=r1)return;
  applyFill({r1,r2:r1,c1,c2},{r1,r2,c1,c2,dir:'down'});
}
function fillSelectionRight(){
  const{r1,r2,c1,c2}=selRange();if(c2<=c1)return;
  applyFill({r1,r2,c1,c2:c1},{r1,r2,c1,c2,dir:'right'});
}
function showFillPreview(target){
  const tl=cellEls[target.r1]&&cellEls[target.r1][target.c1];
  const br=cellEls[target.r2]&&cellEls[target.r2][target.c2];
  if(!tl||!br)return;
  const left=tl.offsetLeft,top=tl.offsetTop;
  const right=br.offsetLeft+br.offsetWidth,bottom=br.offsetTop+br.offsetHeight;
  fillPreview.style.display='block';
  fillPreview.style.left=left+'px';fillPreview.style.top=top+'px';
  fillPreview.style.width=(right-left)+'px';fillPreview.style.height=(bottom-top)+'px';
}
function hideFillPreview(){fillPreview.style.display='none';}

/* RENDER */
function render(){
  const sheet=cur(),grid=$('#grid');
  grid.innerHTML='';
  grid.style.gridTemplateColumns=HEAD_W+'px repeat('+sheet.cols+', '+COL_W+'px)';
  grid.style.gridAutoRows=ROW_H+'px';
  colHeads=[];rowHeads=[];cellEls=[];
  grid.appendChild(el('div','corner'));
  for(let c=0;c<sheet.cols;c++){const h=el('div','colhead');h.textContent=colName(c);h.dataset.c=c;grid.appendChild(h);colHeads.push(h);}
  for(let r=0;r<sheet.rows;r++){
    const rh=el('div','rowhead');rh.textContent=r+1;rh.dataset.r=r;grid.appendChild(rh);rowHeads.push(rh);
    const row=[];
    for(let c=0;c<sheet.cols;c++){const cell=el('div','cell');cell.dataset.r=r;cell.dataset.c=c;grid.appendChild(cell);row.push(cell);}
    cellEls.push(row);
  }
  grid.appendChild(editor);grid.appendChild(fillHandle);grid.appendChild(fillPreview);
  refresh();updateSelectionUI();syncFormulaBar();updateStatus();
}
function displayValue(v,cell){
  if(isErr(v))return v.err;
  if(v instanceof Range)return v.values.length?displayValue(v.values[0],cell):'';
  if(typeof v==='number'){
    const fmt=cell&&cell.st&&cell.st.fmt;
    if(fmt==='fixed2')return v.toFixed(2);
    if(fmt==='currency')return'$'+v.toFixed(2);
    if(fmt==='percent')return(v*100).toFixed(1)+'%';
    return formatNum(v);
  }
  if(typeof v==='boolean')return v?'TRUE':'FALSE';
  if(v==null)return'';
  return String(v);
}
function interpolateColor(a,b,t){
  const ca=hexToRgb(a),cb=hexToRgb(b);
  const r=Math.round(ca.r+(cb.r-ca.r)*t),g=Math.round(ca.g+(cb.g-ca.g)*t),bb=Math.round(ca.b+(cb.b-ca.b)*t);
  return`rgb(${r},${g},${bb})`;
}
function applyCellStyle(e,cell,r,c,getScaleBounds,getCell){
  const st=(cell&&cell.st)||{};
  e.style.fontWeight=st.b?'700':'';
  e.style.fontStyle=st.i?'italic':'';
  e.style.textDecoration=st.u?'underline':'';
  e.style.color=st.color||'';
  e.style.backgroundColor=st.bg||'';
  e.style.backgroundImage='';
  e.style.textAlign=st.align||'';
  e.style.borderBottom=st.bb?('2px solid '+st.bb):'';
  if(st.cscale&&getScaleBounds){
    const b=getScaleBounds(st.cscale.r1,st.cscale.r2,st.cscale.c1,st.cscale.c2);
    const v=getCell(r,c);
    if(typeof v==='number'&&isFinite(v)){
      const t=b.max===b.min?0.5:(v-b.min)/(b.max-b.min);
      e.style.backgroundColor=interpolateColor('#01cdfe','#ff2fd0',clamp(t,0,1));
      e.style.color=t>0.55?'#10011e':'#efe2ff';
    }
  }
  if(st.dbar&&getScaleBounds){
    const b=getScaleBounds(st.dbar.r1,st.dbar.r2,st.dbar.c1,st.dbar.c2);
    const v=getCell(r,c);
    if(typeof v==='number'&&isFinite(v)){
      const range=b.max-b.min;
      const pct=range===0?100:clamp(((v-b.min)/range)*100,0,100);
      e.style.backgroundImage=`linear-gradient(90deg, rgba(1,205,254,0.55) 0%, rgba(1,205,254,0.55) ${pct}%, transparent ${pct}%)`;
    }
  }
}
function refresh(){
  const sheet=cur(),{getCell}=makeEvaluator(sheet);
  const scaleCache=new Map();
  function getScaleBounds(r1,r2,c1,c2){
    const key=r1+','+r2+','+c1+','+c2;
    if(scaleCache.has(key))return scaleCache.get(key);
    let min=Infinity,max=-Infinity;
    for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){
      const v=getCell(r,c);
      if(typeof v==='number'&&isFinite(v)){min=Math.min(min,v);max=Math.max(max,v);}
    }
    const bounds=min===Infinity?{min:0,max:1}:{min,max};
    scaleCache.set(key,bounds);return bounds;
  }
  for(let r=0;r<sheet.rows;r++)for(let c=0;c<sheet.cols;c++){
    const e=cellEls[r][c],cell=sheet.cells[cellKey(r,c)];
    const hasContent=cell&&cell.raw!==''&&cell.raw!=null;
    e.textContent=hasContent?displayValue(getCell(r,c),cell):'';
    applyCellStyle(e,cell,r,c,getScaleBounds,getCell);
  }
  if(chartRange&&!$('#chartPanel').classList.contains('hidden'))drawChart();
}
function updateFillHandle(){
  if(editing){fillHandle.style.display='none';return;}
  const{r2,c2}=selRange();
  const cell=cellEls[r2]&&cellEls[r2][c2];
  if(!cell){fillHandle.style.display='none';return;}
  fillHandle.style.display='block';
  fillHandle.style.left=(cell.offsetLeft+cell.offsetWidth-4)+'px';
  fillHandle.style.top=(cell.offsetTop+cell.offsetHeight-4)+'px';
}
function updateFmtButtons(){
  const{r1,c1}=selRange();
  const cell=cur().cells[cellKey(r1,c1)];
  const st=(cell&&cell.st)||{};
  const map={btnB:!!st.b,btnI:!!st.i,btnU:!!st.u,btnCScale:!!st.cscale,btnBars:!!st.dbar};
  for(const id in map){const b=document.getElementById(id);if(b)b.classList.toggle('on',map[id]);}
}
function updateSelectionUI(){
  const sheet=cur(),{r1,r2,c1,c2}=selRange();
  for(let r=0;r<sheet.rows;r++)for(let c=0;c<sheet.cols;c++){
    const e=cellEls[r][c];
    const inSel=r>=r1&&r<=r2&&c>=c1&&c<=c2;
    const isActive=(r===sel.fr&&c===sel.fc);
    e.classList.toggle('sel',inSel&&!isActive);
    e.classList.toggle('active',isActive);
  }
  for(let c=0;c<colHeads.length;c++)colHeads[c].classList.toggle('hl',c>=c1&&c<=c2);
  for(let r=0;r<rowHeads.length;r++)rowHeads[r].classList.toggle('hl',r>=r1&&r<=r2);
  updateFillHandle();updateFmtButtons();
}
function syncFormulaBar(){
  const cell=cur().cells[cellKey(sel.fr,sel.fc)];
  $('#formulaInput').value=cell?cell.raw:'';
  const{r1,r2,c1,c2}=selRange();
  $('#namebox').textContent=(r1===r2&&c1===c2)?cellKey(sel.fr,sel.fc):cellKey(r1,c1)+':'+cellKey(r2,c2);
}
function updateStatus(){
  const s=document.getElementById('status');if(!s)return;
  const{r1,r2,c1,c2}=selRange();
  const rows=r2-r1+1,cols=c2-c1+1;
  let txt=rows+'×'+cols;
  if(rows*cols>1){
    const{getCell}=makeEvaluator(cur());
    let sum=0,n=0;
    for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){
      const v=getCell(r,c);
      if(typeof v==='number'&&isFinite(v)){sum+=v;n++;}
    }
    if(n)txt+='  •  Σ '+formatNum(sum)+'  •  n='+n;
  }
  s.textContent=txt;
}

function setSel(r,c,extend){
  const sheet=cur();
  r=clamp(r,0,sheet.rows-1);c=clamp(c,0,sheet.cols-1);
  if(extend){sel.fr=r;sel.fc=c;}
  else{sel={ar:r,ac:c,fr:r,fc:c};}
  updateSelectionUI();syncFormulaBar();updateStatus();
}

function applyStyle(mutator){

function copySel(cut){
  const{r1,r2,c1,c2}=selRange();const data=[];
  for(let r=r1;r<=r2;r++){

      row.push(cell?{raw:cell.raw,st:JSON.parse(JSON.stringify(cell.st||{}))}:null);
    }

  }
  clipboard=data;
  if(cut){
    pushUndo();
    for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)delete cur().cells[cellKey(r,c)];

function pasteSel(){
  if(!clipboard||!clipboard.length)return;
  pushUndo();
  const sheet=cur(),fr=sel.fr,fc=sel.fc;
  const needRows=fr+clipboard.length,needCols=fc+clipboard[0].length;
  const grew=needRows>sheet.rows||needCols>sheet.cols;
  if(grew){sheet.rows=Math.min(Math.max(sheet.rows,needRows),MAX_ROWS);sheet.cols=Math.min(Math.max(sheet.cols,needCols),MAX_COLS);}
  clipboard.forEach((row,i)=>row.forEach((cell,j)=>{
    const key=cellKey(fr+i,fc+j);
    if(!cell){delete sheet.cells[key];return;}
    sheet.cells[key]={raw:cell.raw,st:JSON.parse(JSON.stringify(cell.st||{}))};
  }));
  if(grew)render();else{refresh();updateSelectionUI();syncFormulaBar();updateStatus();}
}
function shiftCells(dr,dc,fromRow,fromCol,mode){
  const sheet=cur(),next={};
  for(const[key,cell]of Object.entries(sheet.cells)){
    const p=parseRef(key);if(!p){next[key]=cell;continue;}
    let r=p.r,c=p.c;
    if(dc!==0&&c>=fromCol)c+=(mode==='del'&&c===fromCol)?-1e9:dc;
    if(dr!==0&&r>=fromRow)r+=(mode==='del'&&r===fromRow)?-1e9:dr;
    if(r<0||c<0)continue;
    next[cellKey(r,c)]=cell;
  }
  sheet.cells=next;
}

function closeChart(){$('#chartPanel').classList.add('hidden');}
function drawChart(){
  if(!chartRange)return;
  const canvas=$('#chartCanvas');const dpr=window.devicePixelRatio||1;
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(w===0||h===0)return;
  canvas.width=w*dpr;canvas.height=h*dpr;
  const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  const{r1,r2,c1,c2}=chartRange;const{getCell}=makeEvaluator(cur());
  let hasHead=true,hasLabel=true;
  for(let c=c1;c<=c2;c++){if(typeof getCell(r1,c)!=='string'){hasHead=false;break;}}
  const dataR1=hasHead?r1+1:r1;
  for(let r=dataR1;r<=r2;r++){if(typeof getCell(r,c1)!=='string'){hasLabel=false;break;}}
  const dataC1=hasLabel?c1+1:c1;
  if(dataR1>r2||dataC1>c2){ctx.fillStyle='#9c7cc9';ctx.font='12px monospace';ctx.textAlign='center';ctx.fillText('No numeric data in selection',w/2,h/2);return;}
  const labels=[],series=[];
  for(let r=dataR1;r<=r2;r++)labels.push(hasLabel?String(getCell(r,c1)||''):('Row '+(r-dataR1+1)));
  for(let c=dataC1;c<=c2;c++){
    const name=hasHead?String(getCell(r1,c)||'Series '+(c-dataC1+1)):('Series '+(c-dataC1+1));
    const values=[];
    for(let r=dataR1;r<=r2;r++){const v=getCell(r,c);values.push(typeof v==='number'&&isFinite(v)?v:0);}
    series.push({name,values});
  }
  const type=$('#chartType').value;
  if(type==='pie')drawPie(ctx,labels,series,w,h);
  else drawAxes(ctx,labels,series,w,h,type);
  const title=$('#chartTitle').value.trim();
  if(title){ctx.fillStyle='#fff';ctx.font='bold 13px "Orbitron",sans-serif';ctx.textAlign='center';ctx.fillText(title,w/2,16);}
}
function drawAxes(ctx,labels,series,w,h,type){
  const pad={l:54,r:16,t:28,b:54};
  const cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;
  if(cw<=0||ch<=0)return;
  let dataMin=0,dataMax=0;
  for(const s of series)for(const v of s.values){if(v<dataMin)dataMin=v;if(v>dataMax)dataMax=v;}
  if(dataMin===dataMax){dataMax=dataMin+1;}
  const range=dataMax-dataMin;const yFor=v=>pad.t+ch-((v-dataMin)/range)*ch;
  ctx.font='10px monospace';ctx.textAlign='right';
  for(let i=0;i<=4;i++){
    const val=dataMin+range*i/4,y=yFor(val);
    ctx.strokeStyle='rgba(255,113,206,0.12)';ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.55)';ctx.fillText(formatNum(val),pad.l-5,y+3);
  }
  ctx.strokeStyle='rgba(255,113,206,0.45)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ch);ctx.lineTo(pad.l+cw,pad.t+ch);ctx.stroke();
  const zeroY=yFor(0);
  if(zeroY>=pad.t&&zeroY<=pad.t+ch){ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.beginPath();ctx.moveTo(pad.l,zeroY);ctx.lineTo(pad.l+cw,zeroY);ctx.stroke();}
  const n=labels.length,ns=series.length;const groupW=cw/n;
  if(type==='bar'){
    const innerW=groupW*0.78,barW=innerW/ns;
    for(let i=0;i<n;i++){
      const groupX=pad.l+i*groupW+groupW*0.11;
      for(let j=0;j<ns;j++){
        const v=series[j].values[i];
        const y1=yFor(Math.max(v,0)),y0=yFor(Math.min(v,0));
        ctx.fillStyle=PALETTE[j%PALETTE.length];
        ctx.fillRect(groupX+j*barW,y1,barW-1,y0-y1);
      }
    }
  } else {
    for(let j=0;j<ns;j++){
      const s=series[j],color=PALETTE[j%PALETTE.length];
      if(type==='area'){
        ctx.beginPath();ctx.moveTo(pad.l+groupW/2,zeroY);
        for(let i=0;i<n;i++){const x=pad.l+i*groupW+groupW/2,y=yFor(s.values[i]);ctx.lineTo(x,y);}
        ctx.lineTo(pad.l+(n-1)*groupW+groupW/2,zeroY);ctx.closePath();
        ctx.fillStyle=color+'55';ctx.fill();
      }
      ctx.beginPath();
      for(let i=0;i<n;i++){const x=pad.l+i*groupW+groupW/2,y=yFor(s.values[i]);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
      ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle=color;
      for(let i=0;i<n;i++){const x=pad.l+i*groupW+groupW/2,y=yFor(s.values[i]);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();}
    }
  }
  ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='10px monospace';ctx.textAlign='center';
  for(let i=0;i<n;i++){const label=labels[i];const short=label.length>10?label.slice(0,9)+'…':label;ctx.fillText(short,pad.l+i*groupW+groupW/2,pad.t+ch+16);}
  if(ns>1){
    ctx.textAlign='left';ctx.font='10px monospace';
    let lx=pad.l,ly=h-18;
    for(let j=0;j<ns;j++){
      ctx.fillStyle=PALETTE[j%PALETTE.length];ctx.fillRect(lx,ly-8,10,10);
      ctx.fillStyle='rgba(255,255,255,0.85)';
      const name=series[j].name;ctx.fillText(name,lx+14,ly);
      lx+=14+ctx.measureText(name).width+14;
      if(lx>w-pad.r-40)break;
    }
  }
}
function drawPie(ctx,labels,series,w,h){
  if(!series.length||!series[0].values.length)return;
  const values=series[0].values;
  const total=values.reduce((a,b)=>a+Math.max(0,b),0);
  if(total===0){ctx.fillStyle='#9c7cc9';ctx.font='12px monospace';ctx.textAlign='center';ctx.fillText('No positive values to chart',w/2,h/2);return;}
  const cx=w*0.36,cy=h*0.55,r=Math.min(w*0.28,h*0.36);
  let start=-Math.PI/2;
  for(let i=0;i<values.length;i++){
    const v=Math.max(0,values[i]);
    const angle=(v/total)*Math.PI*2;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+angle);ctx.closePath();
    ctx.fillStyle=PALETTE[i%PALETTE.length];ctx.fill();
    ctx.strokeStyle='#0a0118';ctx.lineWidth=1;ctx.stroke();
    start+=angle;
  }
  ctx.font='10px monospace';ctx.textAlign='left';
  const lx=w*0.68,startY=Math.max(24,cy-r);
  for(let i=0;i<labels.length&&i<12;i++){
    const y=startY+i*15;
    ctx.fillStyle=PALETTE[i%PALETTE.length];ctx.fillRect(lx,y-8,10,10);
    ctx.fillStyle='rgba(255,255,255,0.85)';
    const name=labels[i].length>14?labels[i].slice(0,13)+'…':labels[i];
    ctx.fillText(name,lx+14,y);
  }
}

function download(filename,text,mime){
  const blob=new Blob([text],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function exportCsv(){
  const sheet=cur(),{getCell}=makeEvaluator(sheet);
  let maxR=0,maxC=0;
  for(const key of Object.keys(sheet.cells)){const p=parseRef(key);if(!p)continue;maxR=Math.max(maxR,p.r);maxC=Math.max(maxC,p.c);}
  const lines=[];
  for(let r=0;r<=maxR;r++){
    const row=[];
    for(let c=0;c<=maxC;c++){
      const cell=sheet.cells[cellKey(r,c)];
      let v=cell?displayValue(getCell(r,c),cell):'';
      if(/[",\n\r]/.test(v))v='"'+v.replace(/"/g,'""')+'"';
      row.push(v);
    }
    lines.push(row.join(','));
  }
  download((sheet.name||'sheet').replace(/\s+/g,'_')+'.csv',lines.join('\r\n'),'text/csv;charset=utf-8');
}

      for(const s of data.sheets){
        if(typeof s.name!=='string')s.name='Sheet';

  if(e.target.closest&&e.target.closest('#chartPanel'))return;
  const tag=(e.target.tagName||'').toUpperCase();
  if(editing)return;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  if(e.target.closest&&e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;
  const ctrl=e.ctrlKey||e.metaKey,key=e.key;
  if(ctrl){
    switch(key.toLowerCase()){
      case'z':e.preventDefault();e.shiftKey?redo():undo();return;
      case'y':e.preventDefault();redo();return;
      case'b':e.preventDefault();toggleStyle('b');return;
      case'i':e.preventDefault();toggleStyle('i');return;
      case'u':e.preventDefault();toggleStyle('u');return;
      case'c':e.preventDefault();copySel(false);return;
      case'x':e.preventDefault();copySel(true);return;
      case'v':e.preventDefault();pasteSel();return;
      case'd':e.preventDefault();fillSelectionDown();return;
      case'r':e.preventDefault();fillSelectionRight();return;
    }
    return;
  }
  switch(key){
    case'ArrowUp':e.preventDefault();setSel(sel.fr-1,sel.fc,e.shiftKey);return;
    case'ArrowDown':e.preventDefault();setSel(sel.fr+1,sel.fc,e.shiftKey);return;
    case'ArrowLeft':e.preventDefault();setSel(sel.fr,sel.fc-1,e.shiftKey);return;
    case'ArrowRight':e.preventDefault();setSel(sel.fr,sel.fc+1,e.shiftKey);return;
    case'Enter':e.preventDefault();if(e.shiftKey)setSel(sel.fr-1,sel.fc,false);else openEditor();return;
    case'F2':e.preventDefault();openEditor();return;
    case'Tab':e.preventDefault();setSel(sel.fr,sel.fc+(e.shiftKey?-1:1),false);return;
    case'Delete':case'Backspace':{
      e.preventDefault();pushUndo();
      const{r1,r2,c1,c2}=selRange();
      for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)delete cur().cells[cellKey(r,c)];
      refresh();syncFormulaBar();updateStatus();return;
    }
    case'Escape':return;
  }
  if(key.length===1&&!e.altKey){e.preventDefault();openEditor(key);}
});

const formulaInput=$('#formulaInput');
formulaInput.addEventListener('focus',()=>{formulaInput.value=getCellObj(sel.fr,sel.fc,false)?.raw||'';});
formulaInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    const raw=formulaInput.value;const r=sel.fr,c=sel.fc;
    const cell=getCellObj(r,c,false);const prevRaw=cell?cell.raw:'';
    if(prevRaw!==raw){pushUndo();setCellRaw(r,c,raw);refresh();updateStatus();}
    formulaInput.blur();setSel(r+1,c,false);
  } else if(e.key==='Escape'){formulaInput.blur();syncFormulaBar();}
});
formulaInput.addEventListener('blur',()=>{
  const raw=formulaInput.value;const r=sel.fr,c=sel.fc;
  const cell=getCellObj(r,c,false);const prevRaw=cell?cell.raw:'';
  if(prevRaw!==raw){pushUndo();setCellRaw(r,c,raw);refresh();updateStatus();}
});

(function seed(){
  const start={r:1,c:1};
  const header=['Item','Qty','Price','Total'];
  const rows=[
    ['Neon Grid','3','12.50'],
    ['Vapor Drive','1','99.00'],
    ['Cyan Wave','7','4.25'],
    ['Pink Sunset','2','15.75'],
    ['Mint Circuit','5','22.00']
  ];
  const theme=THEMES.neon;
  for(let c=0;c<4;c++){
    const cell=getCellObj(start.r,start.c+c,true);
    cell.raw=header[c];
    cell.st={b:true,color:theme.headText,bg:theme.head,align:'center',bb:theme.accent};
  }
  for(let r=0;r<rows.length;r++){
    for(let c=0;c<3;c++){
      const cell=getCellObj(start.r+1+r,start.c+c,true);
      cell.raw=rows[r][c];
      if((r%2)===1)cell.st={bg:theme.band};
    }
    const excelRow=start.r+r+2;
    const tc=getCellObj(start.r+1+r,start.c+3,true);
    tc.raw='=C'+excelRow+'*B'+excelRow;
    tc.st={align:'right'};
  }
  refresh();
})();
</script>
